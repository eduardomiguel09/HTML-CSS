<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralização vertical de caixa</title>
    <style>
    #container{
        background-image: url("") ;
        background-size: 100% 100%;
        position: relative;
        height: 100vh;
        padding: 10px;
        background-color: purple;


    }
    #conteudo{
        background-image: url("") ;
        background-size: 100% 100% ;
        position: absolute;
        height: 200px;
        width: 400px;
        left:50%;
        top: 50%;
        transform: translate(-50%,-50%);
        background-color: yellow;


    }
    </style>
    
</head>
<body>

    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
